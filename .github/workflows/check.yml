name: Check knowledge base

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate files and links
        run: node scripts/validate.js
      - name: Check the index is up to date
        run: node scripts/build-index.js --check
